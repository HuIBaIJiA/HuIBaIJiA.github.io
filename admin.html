<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>管理员端 - 爱心应用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ff6b8b, #ff8e53);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        /* 屏幕切换 */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 登录界面 */
        .login-container {
            max-width: 400px;
            margin: 100px auto 0;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .admin-logo {
            text-align: center;
            font-size: 24px;
            color: #ff6b8b;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .admin-logo .heart {
            display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff6b8b;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 107, 139, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #4a90e2, #357ae8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(74, 144, 226, 0.3);
        }

        .error {
            color: #ff4757;
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            background: rgba(255, 71, 87, 0.1);
            border-radius: 8px;
            display: none;
        }

        /* 文字动画效果 */
        .texts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .falling-text {
            position: absolute;
            font-size: 20px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: textFall linear forwards;
            white-space: nowrap;
        }

        @keyframes textFall {
            0% {
                transform: translateY(-50px) rotate(-5deg);
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 50px)) rotate(5deg);
                opacity: 0;
            }
        }

        /* 主界面 */
        .admin-header {
            text-align: center;
            padding: 25px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .welcome-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .welcome-subtitle {
            color: #666;
            font-size: 16px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #ff6b8b;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        /* 消息列表 */
        .messages-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        .date-filter {
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        .filter-btn {
            padding: 14px 28px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: #357ae8;
            transform: translateY(-2px);
        }

        .refresh-btn {
            padding: 14px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .message-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #4a90e2;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .message-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .message-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff6b8b, #ff8e53);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .message-author {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .message-time {
            color: #666;
            font-size: 14px;
            background: #f8f9fa;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .message-date {
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .message-content {
            color: #333;
            line-height: 1.7;
            font-size: 16px;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }

        .message-number {
            position: absolute;
            top: 20px;
            right: 25px;
            background: linear-gradient(45deg, #ff6b8b, #ff8e53);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .logout-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(45deg, #ff6b8b, #ff8e53);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 139, 0.3);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 107, 139, 0.4);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .login-container {
                margin: 50px auto 0;
                padding: 30px 25px;
            }

            .admin-header {
                padding: 20px 15px;
            }

            .welcome-title {
                font-size: 22px;
            }

            .stats-bar {
                flex-direction: column;
                gap: 20px;
            }

            .filter-bar {
                flex-direction: column;
            }

            .search-input,
            .date-filter,
            .filter-btn,
            .refresh-btn {
                width: 100%;
            }

            .message-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .message-number {
                position: relative;
                top: 0;
                right: 0;
                align-self: flex-end;
                margin-top: -40px;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #ff6b8b, #ff8e53);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <div class="admin-logo">
                <span class="heart">❤️</span> 管理员系统 <span class="heart">❤️</span>
            </div>
            <div class="input-group">
                <input type="text" id="username" placeholder="请输入管理员用户名" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="请输入密码" autocomplete="off">
            </div>
            <button class="login-btn" onclick="adminLogin()">登录管理后台</button>
            <div id="login-error" class="error">用户名或密码错误</div>
        </div>
    </div>

    <!-- 文字动画容器 -->
    <div id="texts-container" class="texts-container"></div>

    <!-- 管理后台主界面 -->
    <div id="admin-dashboard" class="screen">
        <div class="admin-header">
            <div class="welcome-title">👨‍💼 欢迎回来，徐迎博</div>
            <div class="welcome-subtitle">查看zzt的所有留言，好好珍惜这份心意 ❤️</div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-number" id="total-messages">0</div>
                <div class="stat-label">总消息数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="today-messages">0</div>
                <div class="stat-label">今日消息</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="latest-date">-</div>
                <div class="stat-label">最新日期</div>
            </div>
        </div>

        <div class="messages-container">
            <div class="filter-bar">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 搜索消息内容...">
                <input type="date" id="date-filter" class="date-filter">
                <button class="filter-btn" onclick="filterMessages()">筛选</button>
                <button class="refresh-btn" onclick="loadMessages()">🔄 刷新</button>
            </div>

            <div id="messages-list">
                <!-- 消息会动态加载到这里 -->
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <h3>暂无消息</h3>
                    <p>等待zzt发送第一条消息...</p>
                </div>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">🚪 退出登录</button>
    </div>

    <script>
        // 管理员登录信息
        const ADMIN_USERNAME = "徐迎博";
        const ADMIN_PASSWORD = "xybLOVEzzt";

        // 文字内容 - 会下落的文本
        const FALLING_TEXT = "一定永远要对zzt好";
        
        // 模拟数据 - 实际使用时应该从服务器获取
        let allMessages = JSON.parse(localStorage.getItem('love_messages_from_zzt') || '[]');
        let filteredMessages = [];

        // 管理员登录
        function adminLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('login-error');

            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                errorElement.style.display = 'none';
                
                // 显示文字下落动画
                showTextAnimation();
                
                // 2秒后进入管理后台
                setTimeout(() => {
                    document.getElementById('login-screen').classList.remove('active');
                    document.getElementById('admin-dashboard').classList.add('active');
                    loadMessages();
                }, 2000);
            } else {
                errorElement.style.display = 'block';
            }
        }

        // 显示文字下落动画
        function showTextAnimation() {
            const container = document.getElementById('texts-container');
            const textCount = 30; // 文字数量
            
            for (let i = 0; i < textCount; i++) {
                setTimeout(() => {
                    const textElement = document.createElement('div');
                    textElement.className = 'falling-text';
                    textElement.textContent = FALLING_TEXT;
                    
                    // 随机位置
                    const left = Math.random() * 90 + 5; // 5% - 95%
                    const duration = 2 + Math.random() * 2; // 2-4秒
                    const delay = Math.random() * 1.5; // 0-1.5秒延迟
                    const fontSize = 16 + Math.random() * 10; // 16-26px
                    const rotation = (Math.random() - 0.5) * 20; // -10到10度
                    
                    textElement.style.left = `${left}%`;
                    textElement.style.animationDuration = `${duration}s`;
                    textElement.style.animationDelay = `${delay}s`;
                    textElement.style.fontSize = `${fontSize}px`;
                    textElement.style.transform = `rotate(${rotation}deg)`;
                    
                    // 随机颜色
                    const colors = ['#ffffff', '#ffe6e6', '#ffd6d6'];
                    textElement.style.color = colors[Math.floor(Math.random() * colors.length)];
                    
                    container.appendChild(textElement);
                    
                    // 动画结束后移除元素
                    setTimeout(() => {
                        textElement.remove();
                    }, (duration + delay) * 1000);
                }, i * 100); // 每个文字间隔100ms
            }
        }

        // 加载所有消息
        function loadMessages() {
            // 在实际应用中，这里应该从服务器获取数据
            // 暂时使用本地存储的数据
            
            // 从主应用同步数据（模拟）
            syncFromMainApp();
            
            // 按时间倒序排列
            allMessages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            // 更新统计数据
            updateStats();
            
            // 显示所有消息
            filteredMessages = [...allMessages];
            displayMessages(filteredMessages);
        }

        // 从主应用同步数据（模拟）
        function syncFromMainApp() {
            try {
                // 尝试从主应用获取数据
                // 在实际应用中，这里应该是API调用
                const mainAppMessages = JSON.parse(localStorage.getItem('love_messages') || '[]');
                
                // 只同步zzt的消息
                const zztMessages = mainAppMessages.filter(msg => msg.username === "朱籽橦");
                
                // 合并数据，避免重复
                zztMessages.forEach(newMsg => {
                    if (!allMessages.some(existingMsg => existingMsg.id === newMsg.id)) {
                        allMessages.push(newMsg);
                    }
                });
                
                // 保存到管理员端专用存储
                localStorage.setItem('love_messages_from_zzt', JSON.stringify(allMessages));
                
            } catch (error) {
                console.error('同步数据失败:', error);
            }
        }

        // 更新统计数据
        function updateStats() {
            // 总消息数
            document.getElementById('total-messages').textContent = allMessages.length;
            
            // 今日消息数
            const today = new Date().toLocaleDateString('zh-CN');
            const todayMessages = allMessages.filter(msg => {
                const msgDate = new Date(msg.timestamp || msg.date).toLocaleDateString('zh-CN');
                return msgDate === today;
            });
            document.getElementById('today-messages').textContent = todayMessages.length;
            
            // 最新消息日期
            if (allMessages.length > 0) {
                const latestDate = new Date(allMessages[0].timestamp || allMessages[0].date);
                document.getElementById('latest-date').textContent = latestDate.toLocaleDateString('zh-CN');
            }
        }

        // 显示消息列表
        function displayMessages(messages) {
            const container = document.getElementById('messages-list');
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <h3>暂无消息</h3>
                        <p>没有找到符合条件的消息</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            messages.forEach((msg, index) => {
                const messageDate = new Date(msg.timestamp || msg.date);
                const formattedDate = messageDate.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                const timeAgo = getTimeAgo(messageDate);
                
                html += `
                    <div class="message-card">
                        <div class="message-number">${messages.length - index}</div>
                        <div class="message-header">
                            <div class="message-author">
                                <span style="color: #ff6b8b;">❤️</span> ${msg.username}
                            </div>
                            <div class="message-time">${timeAgo}</div>
                        </div>
                        <div class="message-date">
                            📅 ${formattedDate}
                        </div>
                        <div class="message-content">
                            ${msg.content}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // 获取相对时间（如：3分钟前）
        function getTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return '刚刚';
            if (diffMins < 60) return `${diffMins}分钟前`;
            if (diffHours < 24) return `${diffHours}小时前`;
            if (diffDays < 7) return `${diffDays}天前`;
            
            return date.toLocaleDateString('zh-CN');
        }

        // 筛选消息
        function filterMessages() {
            const searchText = document.getElementById('search-input').value.toLowerCase();
            const filterDate = document.getElementById('date-filter').value;
            
            filteredMessages = allMessages.filter(msg => {
                // 搜索内容
                const contentMatch = msg.content.toLowerCase().includes(searchText);
                
                // 筛选日期
                let dateMatch = true;
                if (filterDate) {
                    const msgDate = new Date(msg.timestamp || msg.date);
                    const msgDateStr = msgDate.toISOString().split('T')[0];
                    dateMatch = msgDateStr === filterDate;
                }
                
                return contentMatch && dateMatch;
            });
            
            displayMessages(filteredMessages);
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                document.getElementById('admin-dashboard').classList.remove('active');
                document.getElementById('login-screen').classList.add('active');
                
                // 清空输入框
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            }
        }

        // 页面加载时检查登录状态
        window.addEventListener('DOMContentLoaded', () => {
            // 可以添加自动登录逻辑（如果需要）
            // 例如：检查本地存储的token
        });

        // 添加模拟数据（仅用于测试）
        function addTestData() {
            const testMessages = [
                {
                    id: 1,
                    username: "朱籽橦",
                    content: "今天特别想你，希望你也一样想我 ❤️",
                    date: new Date().toLocaleString('zh-CN'),
                    timestamp: new Date()
                },
                {
                    id: 2,
                    username: "朱籽橦",
                    content: "要记得按时吃饭，好好照顾自己！",
                    date: new Date(Date.now() - 86400000).toLocaleString('zh-CN'),
                    timestamp: new Date(Date.now() - 86400000)
                }
            ];
            
            // 保存测试数据
            localStorage.setItem('love_messages', JSON.stringify(testMessages));
            localStorage.setItem('love_messages_from_zzt', JSON.stringify(testMessages));
            
            alert('已添加测试数据，刷新页面后可以看到示例消息');
        }

        // 导出数据功能
        function exportData() {
            const dataStr = JSON.stringify(allMessages, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = `zzt的留言_${new Date().toLocaleDateString('zh-CN')}.json`;
            link.click();
            
            alert(`已导出 ${allMessages.length} 条消息`);
        }

        // 添加导出按钮到界面
        window.addEventListener('DOMContentLoaded', () => {
            const logoutBtn = document.querySelector('.logout-btn');
            if (logoutBtn) {
                const exportBtn = logoutBtn.cloneNode(true);
                exportBtn.textContent = '💾 导出数据';
                exportBtn.style.right = '180px';
                exportBtn.style.background = 'linear-gradient(45deg, #4CAF50, #45a049)';
                exportBtn.onclick = exportData;
                logoutBtn.parentNode.insertBefore(exportBtn, logoutBtn.nextSibling);
            }
        });
    </script>
</body>
</html>
