<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理员端 - 爱心留言板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .login-box, .admin-panel { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); margin-top: 50px; }
        h2 { text-align: center; color: #764ba2; margin-bottom: 30px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .message-card { background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 20px; border-left: 5px solid #764ba2; }
        .message-time { color: #666; font-size: 14px; margin-bottom: 10px; }
        .message-content { font-size: 16px; line-height: 1.5; white-space: pre-wrap; }
        .stats { display: flex; justify-content: space-between; align-items: center; background: #f0f0f0; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .error { color: red; text-align: center; margin-top: 15px; display: none; }
        .back-btn { background: #6c757d; margin-top: 0; margin-bottom: 20px; }
        .refresh-btn { width: auto; padding: 8px 20px; margin: 0; background: #28a745; }
        .sync-status { text-align: center; font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div id="loginScreen" class="login-box">
        <h2>🔐 管理员登录</h2>
        <input type="text" id="adminUser" placeholder="用户名">
        <input type="password" id="adminPwd" placeholder="密码">
        <button onclick="adminLogin()">登录管理后台</button>
        <div id="loginError" class="error">用户名或密码错误</div>
    </div>

    <div id="adminPanel" class="admin-panel" style="display:none;">
        <button class="back-btn" onclick="logout()">← 退出登录</button>
        <h2>💌 来自朱籽橦的留言</h2>
        <div class="stats">
            <span>📊 总留言数：<strong id="totalCount">0</strong></span>
            <button class="refresh-btn" onclick="loadMessages()">🔄 刷新</button>
        </div>
        <div id="messagesList"><div style="text-align:center; padding:40px; color:#999;">暂无留言</div></div>
        <div id="syncStatus" class="sync-status"></div>
    </div>
</div>

<script>
    const ADMIN_USER = "徐迎博";
    const ADMIN_PASS = "xybLOVEzzt";
    
    // ==================== GitHub Gist 云端配置（和用户端相同）====================
    const GIST_ID = "fcd88caa2c69fed316641ccdb462f1eb";
    const GITHUB_TOKEN = "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";

    function showStatus(msg, isError = false) {
        const el = document.getElementById('syncStatus');
        if (el) {
            el.textContent = msg;
            el.style.color = isError ? 'red' : '#4CAF50';
            setTimeout(() => { if(el) el.textContent = ''; }, 3000);
        }
    }

    async function loadFromCloud() {
        try {
            const response = await fetch(`https://api.github.com/gists/${GIST_ID}`);
            if (!response.ok) return [];
            const data = await response.json();
            const content = JSON.parse(data.files['love-messages.json'].content);
            return content.messages || [];
        } catch (error) {
            console.error('加载失败:', error);
            return [];
        }
    }

    async function loadMessages() {
        const container = document.getElementById('messagesList');
        if (!container) return;
        container.innerHTML = '<div style="text-align:center; padding:40px;">🔄 加载中...</div>';
        showStatus('正在同步...');
        const allMessages = await loadFromCloud();
        const zztMessages = allMessages.filter(msg => msg.username === "朱籽橦");
        zztMessages.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        document.getElementById('totalCount').innerText = zztMessages.length;
        if (zztMessages.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color:#999;">💬 暂无留言</div>';
            showStatus('暂无新留言');
            return;
        }
        let html = '';
        for (let msg of zztMessages) {
            html += `<div class="message-card"><div class="message-time">📅 ${msg.date || '未知时间'}</div><div class="message-content">${escapeHtml(msg.content)}</div></div>`;
        }
        container.innerHTML = html;
        showStatus(`✅ 已加载 ${zztMessages.length} 条留言`);
    }

    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    function adminLogin() {
        const username = document.getElementById('adminUser').value.trim();
        const password = document.getElementById('adminPwd').value.trim();
        const errorDiv = document.getElementById('loginError');
        if (username === ADMIN_USER && password === ADMIN_PASS) {
            errorDiv.style.display = 'none';
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadMessages();
            if (window.autoRefresh) clearInterval(window.autoRefresh);
            window.autoRefresh = setInterval(() => {
                if (document.getElementById('adminPanel').style.display === 'block') loadMessages();
            }, 30000);
        } else {
            errorDiv.style.display = 'block';
        }
    }

    function logout() {
        if (window.autoRefresh) clearInterval(window.autoRefresh);
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('adminUser').value = '';
        document.getElementById('adminPwd').value = '';
    }
</script>
</body>
</html>
