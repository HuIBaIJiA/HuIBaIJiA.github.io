<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>爱心应用</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #ffafbd, #ffc3a0); min-height: 100vh; padding: 20px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .login-container { max-width: 400px; margin: 100px auto 0; padding: 40px; background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .logo { text-align: center; font-size: 28px; color: #ff6b8b; margin-bottom: 30px; font-weight: bold; }
        .input-group { margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        input:focus { outline: none; border-color: #ff6b8b; }
        .login-btn { width: 100%; padding: 15px; background: linear-gradient(45deg, #ff6b8b, #ff8e53); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .error { color: #ff4757; text-align: center; margin-top: 10px; display: none; }
        .hearts-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .heart { position: absolute; font-size: 24px; color: #ff6b8b; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }
        .header { text-align: center; padding: 20px; color: white; }
        .user-info { font-size: 24px; margin-bottom: 10px; }
        .menu { max-width: 600px; margin: 20px auto; }
        .menu-item { background: white; margin: 15px 0; padding: 20px; border-radius: 15px; cursor: pointer; transition: transform 0.3s; }
        .menu-item:hover { transform: translateX(10px); }
        .back-btn { background: #4a90e2; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-bottom: 20px; cursor: pointer; }
        .message-input { width: 100%; min-height: 150px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; margin: 20px 0; resize: vertical; }
        .save-btn { background: #4a90e2; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; cursor: pointer; display: block; margin: 0 auto 20px; }
        .messages-list { margin-top: 30px; }
        .message-item { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; border-left: 4px solid #ff6b8b; }
        .message-date { color: #888; font-size: 12px; margin-bottom: 8px; }
        .sync-status { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; z-index: 1000; }
    </style>
</head>
<body>
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <div class="logo">❤️ 爱心应用 ❤️</div>
            <div class="input-group"><input type="text" id="username" placeholder="请输入用户名"></div>
            <div class="input-group"><input type="password" id="password" placeholder="请输入密码"></div>
            <button class="login-btn" id="login-button">登录</button>
            <div id="login-error" class="error">用户名或密码错误</div>
        </div>
    </div>
    <div id="hearts-container" class="hearts-container"></div>
    <div id="main-menu" class="screen">
        <div class="header"><div class="user-info" id="welcome-text"></div><p>❤️ 欢迎使用爱心应用 ❤️</p></div>
        <div class="menu" id="menu-container">
            <div class="menu-item" id="new-message-btn"><h3>📝 想对xyb说的话</h3><p>写下你想说的话并保存</p></div>
        </div>
    </div>
    <div id="message-screen" class="screen">
        <button class="back-btn" id="back-button">← 返回</button>
        <h2>💌 想对xyb说的话</h2>
        <textarea id="message-input" class="message-input" placeholder="在这里写下你想说的话..."></textarea>
        <button class="save-btn" id="save-button">保存消息</button>
        <div class="messages-list" id="messages-list"></div>
    </div>
    <div id="sync-status" class="sync-status"></div>

    <script>
        const CORRECT_USERNAME = "朱籽橦";
        const CORRECT_PASSWORD = "zztLOVExyb";
        
        // ==================== 云端配置 ====================
        const CLOUD_URL = "https://jsonbase.com/s/67f9e8d4c3b2a1e5d6c7b8a9";

        let messages = [];

        function showStatus(msg, isError = false) {
            const el = document.getElementById('sync-status');
            if (el) {
                el.textContent = msg;
                el.style.background = isError ? 'rgba(244,67,54,0.9)' : 'rgba(76,175,80,0.9)';
                setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 3000);
            }
        }

        // 从云端加载
        async function loadFromCloud() {
            try {
                const response = await fetch(CLOUD_URL);
                if (!response.ok) return [];
                const data = await response.json();
                return data.messages || [];
            } catch (error) {
                console.error('加载失败:', error);
                return [];
            }
        }

        // 保存到云端
        async function saveToCloud(messageData) {
            try {
                const getRes = await fetch(CLOUD_URL);
                let existingMessages = [];
                if (getRes.ok) {
                    const data = await getRes.json();
                    existingMessages = data.messages || [];
                }
                existingMessages.unshift(messageData);
                const putRes = await fetch(CLOUD_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: existingMessages })
                });
                return putRes.ok;
            } catch (error) {
                console.error('云端保存失败:', error);
                return false;
            }
        }

        async function syncWithCloud() {
            const cloudMessages = await loadFromCloud();
            if (cloudMessages.length > 0) {
                messages = cloudMessages;
                localStorage.setItem('love_messages', JSON.stringify(messages));
                displayMessages();
                updateMenuItems();
                showStatus(`已同步 ${messages.length} 条消息`, false);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('login-button').addEventListener('click', login);
            document.getElementById('save-button').addEventListener('click', saveMessage);
            document.getElementById('back-button').addEventListener('click', showMainMenu);
            document.getElementById('new-message-btn').addEventListener('click', showMessageScreen);
            loadLocalMessages();
            checkLoginStatus();
        });

        function loadLocalMessages() {
            try {
                const saved = localStorage.getItem('love_messages');
                messages = saved ? JSON.parse(saved) : [];
                displayMessages();
                updateMenuItems();
            } catch (error) { messages = []; }
        }

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('login-error');
            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                errorElement.style.display = 'none';
                localStorage.setItem('is_logged_in', 'true');
                localStorage.setItem('username', username);
                showHeartsAnimation();
                setTimeout(async () => {
                    document.getElementById('login-screen').classList.remove('active');
                    document.getElementById('main-menu').classList.add('active');
                    document.getElementById('welcome-text').textContent = `欢迎，${username}！`;
                    await syncWithCloud();
                    displayMessages();
                    updateMenuItems();
                }, 2000);
            } else {
                errorElement.style.display = 'block';
            }
        }

        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('is_logged_in');
            const username = localStorage.getItem('username');
            if (isLoggedIn === 'true' && username) {
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('main-menu').classList.add('active');
                document.getElementById('welcome-text').textContent = `欢迎回来，${username}！`;
                syncWithCloud();
            }
        }

        function showHeartsAnimation() {
            const container = document.getElementById('hearts-container');
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = '❤️';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (1.5 + Math.random()) + 's';
                    heart.style.animationDelay = Math.random() + 's';
                    container.appendChild(heart);
                    setTimeout(() => heart.remove(), 3000);
                }, i * 50);
            }
        }

        async function saveMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) { alert('请输入内容'); return; }
            
            const saveBtn = document.getElementById('save-button');
            const originalText = saveBtn.textContent;
            saveBtn.textContent = '保存中...';
            saveBtn.disabled = true;
            
            const messageData = {
                id: Date.now().toString(),
                username: CORRECT_USERNAME,
                content: message,
                date: new Date().toLocaleString('zh-CN'),
                timestamp: Date.now()
            };
            
            messages.unshift(messageData);
            localStorage.setItem('love_messages', JSON.stringify(messages));
            input.value = '';
            displayMessages();
            updateMenuItems();
            
            const success = await saveToCloud(messageData);
            saveBtn.textContent = originalText;
            saveBtn.disabled = false;
            
            if (success) {
                alert('💌 消息已保存并同步到云端！');
            } else {
                alert('💾 消息已保存到本地，网络恢复后会自动同步');
            }
        }

        function displayMessages() {
            const container = document.getElementById('messages-list');
            if (!container) return;
            container.innerHTML = '';
            if (messages.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">📝 还没有消息</div>';
                return;
            }
            messages.forEach((msg) => {
                const div = document.createElement('div');
                div.className = 'message-item';
                div.innerHTML = `<div class="message-date">📅 ${msg.date}</div><div class="message-content">${escapeHtml(msg.content)}</div>`;
                container.appendChild(div);
            });
        }

        function updateMenuItems() {
            const container = document.getElementById('menu-container');
            if (!container) return;
            const children = container.children;
            while (children.length > 1) container.removeChild(children[children.length - 1]);
            for (let i = 0; i < Math.min(messages.length, 10); i++) {
                const msg = messages[i];
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                menuItem.innerHTML = `<h3>💌 ${i === 0 ? '最新留言' : `第${i + 1}条留言`}</h3><p>${msg.date ? msg.date.substring(0, 16) : '未知时间'}</p>`;
                menuItem.onclick = () => showMessageScreen();
                container.appendChild(menuItem);
            }
        }

        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function showMessageScreen() { document.getElementById('main-menu').classList.remove('active'); document.getElementById('message-screen').classList.add('active'); displayMessages(); }
        function showMainMenu() { document.getElementById('message-screen').classList.remove('active'); document.getElementById('main-menu').classList.add('active'); }

        setInterval(() => {
            if (document.getElementById('main-menu').classList.contains('active') ||
                document.getElementById('message-screen').classList.contains('active')) {
                syncWithCloud();
            }
        }, 30000);
    </script>
</body>
</html>
