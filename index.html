<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>爱心应用</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js"></script>
    
    <!-- PWA配置 -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body>
    <!-- 登录界面 -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <div class="logo">❤️ 爱心应用 ❤️</div>
            <div class="input-group">
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="请输入密码" autocomplete="off">
            </div>
            <button class="login-btn" onclick="login()">登录</button>
            <div id="login-error" class="error">用户名或密码错误</div>
        </div>
    </div>

    <!-- 爱心动画容器 -->
    <div id="hearts-container" class="hearts-container"></div>

    <!-- 主菜单 -->
    <div id="main-menu" class="screen">
        <div class="header">
            <div class="user-info" id="welcome-text"></div>
            <p>❤️ 欢迎使用爱心应用 ❤️</p>
        </div>
        <div class="menu" id="menu-container">
            <div class="menu-item" onclick="showMessageScreen()">
                <h3>📝 想对xyb说的话</h3>
                <p>写下你想说的话并保存</p>
            </div>
            <!-- 已保存的消息会动态添加到这里 -->
        </div>
    </div>

    <!-- 消息界面 -->
    <div id="message-screen" class="screen">
        <button class="back-btn" onclick="showMainMenu()">← 返回</button>
        <h2>💌 想对xyb说的话</h2>
        <textarea id="message-input" class="message-input" placeholder="在这里写下你想说的话..."></textarea>
        <button class="save-btn" onclick="saveMessage()">保存消息</button>
        
        <div class="messages-list" id="messages-list">
            <!-- 已保存的消息会显示在这里 -->
        </div>
    </div>

    <script>
        // 用户验证
        const CORRECT_USERNAME = "朱籽橦";
        const CORRECT_PASSWORD = "zztLOVExyb";

        // Firebase配置
        const firebaseConfig = {
            apiKey: "AIzaSyARYAIzTYmkzlXzjZiC61hyqydd5uejpqY",
            authDomain: "lovemessages-fe35b.firebaseapp.com",
            projectId: "lovemessages-fe35b",
            storageBucket: "lovemessages-fe35b.firebasestorage.app",
            messagingSenderId: "969647616451",
            appId: "1:969647616451:web:a7fc822897ab0058f98d76"
        };

        // 初始化Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 本地消息存储
        let messages = JSON.parse(localStorage.getItem('love_messages') || '[]');

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('login-error');

            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                errorElement.style.display = 'none';
                showHeartsAnimation();
                
                setTimeout(() => {
                    document.getElementById('login-screen').classList.remove('active');
                    document.getElementById('main-menu').classList.add('active');
                    document.getElementById('welcome-text').textContent = `欢迎，${username}！`;
                    loadMenuItems();
                    loadMessagesFromFirebase();
                }, 2000);
            } else {
                errorElement.style.display = 'block';
            }
        }

        function showHeartsAnimation() {
            const container = document.getElementById('hearts-container');
            const heartCount = 50;
            
            for (let i = 0; i < heartCount; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = '❤️';
                    
                    const left = Math.random() * 100;
                    const duration = 2 + Math.random() * 1;
                    const delay = Math.random() * 2;
                    
                    heart.style.left = `${left}%`;
                    heart.style.animationDuration = `${duration}s`;
                    heart.style.animationDelay = `${delay}s`;
                    
                    container.appendChild(heart);
                    
                    setTimeout(() => {
                        heart.remove();
                    }, (duration + delay) * 1000);
                }, i * 40);
            }
        }

        async function loadMessagesFromFirebase() {
            try {
                const querySnapshot = await db.collection('love_messages')
                    .orderBy('timestamp', 'desc')
                    .get();
                
                messages = [];
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    messages.push({
                        id: doc.id,
                        ...data,
                        date: data.date || new Date(data.timestamp?.toDate()).toLocaleString('zh-CN')
                    });
                });
                
                localStorage.setItem('love_messages', JSON.stringify(messages));
                displayMessages();
                updateMenuItems();
                
            } catch (error) {
                console.error('云端加载失败:', error);
                messages = JSON.parse(localStorage.getItem('love_messages') || '[]');
                displayMessages();
                updateMenuItems();
            }
        }

        async function saveMessageToFirebase() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (!message) {
                alert('请输入内容');
                return;
            }
            
            const messageData = {
                username: CORRECT_USERNAME,
                content: message,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                date: new Date().toLocaleString('zh-CN')
            };
            
            try {
                await db.collection('love_messages').add(messageData);
                
                // 添加到本地
                messages.unshift({
                    id: Date.now().toString(),
                    ...messageData
                });
                
                localStorage.setItem('love_messages', JSON.stringify(messages));
                input.value = '';
                displayMessages();
                updateMenuItems();
                
                alert('💌 消息已保存到云端！xyb现在就能看到！');
                
            } catch (error) {
                console.error('保存失败:', error);
                alert('网络有问题，已保存到本地');
                
                // 本地备份
                messageData.timestamp = new Date();
                messages.unshift({
                    id: Date.now().toString(),
                    ...messageData
                });
                localStorage.setItem('love_messages', JSON.stringify(messages));
                displayMessages();
                updateMenuItems();
            }
        }

        function displayMessages() {
            const container = document.getElementById('messages-list');
            container.innerHTML = '';
            
            messages.forEach(msg => {
                const messageElement = document.createElement('div');
                messageElement.className = 'message-item';
                messageElement.innerHTML = `
                    <div class="message-date">📅 ${msg.date}</div>
                    <div class="message-content">${msg.content}</div>
                `;
                container.appendChild(messageElement);
            });
        }

        function updateMenuItems() {
            const container = document.getElementById('menu-container');
            while (container.children.length > 1) {
                container.removeChild(container.lastChild);
            }
            
            messages.forEach((msg, index) => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                menuItem.innerHTML = `
                    <h3>💌 第${index + 1}条留言</h3>
                    <p>${msg.date}</p>
                `;
                menuItem.onclick = () => showMessageScreen();
                container.appendChild(menuItem);
            });
        }

        function showMessageScreen() {
            document.getElementById('main-menu').classList.remove('active');
            document.getElementById('message-screen').classList.add('active');
            displayMessages();
        }

        function showMainMenu() {
            document.getElementById('message-screen').classList.remove('active');
            document.getElementById('main-menu').classList.add('active');
        }

        function saveMessage() {
            saveMessageToFirebase();
        }

        function loadMenuItems() {
            updateMenuItems();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('is_logged_in');
            if (isLoggedIn) {
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('main-menu').classList.add('active');
                loadMessagesFromFirebase();
            }
        });
    </script>
</body>
</html>
